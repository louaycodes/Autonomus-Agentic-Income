services:
  trading-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex-trading-agent
    restart: always
    environment:
      - TRADING_MODE=${TRADING_MODE:-paper}
      - EXCHANGE_NAME=${EXCHANGE_NAME:-binance}
      - SYMBOL=${SYMBOL:-SOL/USDT}
      - TOTAL_CAPITAL_USD=${TOTAL_CAPITAL_USD:-100.0}
      - GRID_LEVELS=${GRID_LEVELS:-10}
      - GRID_STEP_PERCENT=${GRID_STEP_PERCENT:-1.2}
      - RANGE_HALF_SPAN_PERCENT=${RANGE_HALF_SPAN_PERCENT:-8.0}
      - ENABLE_TREND_GUARD=${ENABLE_TREND_GUARD:-true}
      - EXCHANGE_API_KEY=${EXCHANGE_API_KEY:-}
      - EXCHANGE_API_SECRET=${EXCHANGE_API_SECRET:-}
      - EXCHANGE_PASSWORD=${EXCHANGE_PASSWORD:-}
      - DATA_DIR=/app/data
      - DB_NAME=trading.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - POLL_INTERVAL_SECONDS=3
      - DAILY_REPORT_HOUR_UTC=23
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
